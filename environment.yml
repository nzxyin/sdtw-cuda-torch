# Conda environment for softdtw-cuda-torch (development, benchmarks, examples).
#
# The package is pure Python + Numba-JIT CUDA kernels (no compiled extension), so
# `pip install -e .` is enough on any platform that has a CUDA-enabled PyTorch. This
# file is a convenience that also pulls the benchmark/example/test extras.
#
# CUDA notes:
#   * CUDA kernels use numba-cuda-mlir (not numba.cuda/numba-cuda): plain numba.cuda
#     breaks on Numba 0.66+ for this repo's kernels (see README's "Why numba-cuda-mlir?"
#     and issue #2). numba-cuda-mlir does not have the old CUDA-toolkit-<=12.6 ceiling.
#   * Pick the numba-cuda-mlir extra matching your CUDA toolkit: cu12 or cu13 below.
#   * Install a PyTorch build whose CUDA matches your driver, e.g.:
#       pip install torch --index-url https://download.pytorch.org/whl/cu130
name: sdtw-cuda-torch
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch>=2.0
      - numba>=0.60
      - numba-cuda-mlir[cu13]>=0.5   # or numba-cuda-mlir[cu12] for CUDA 12.x
      - numpy>=2.0
      - matplotlib>=3.7   # benchmarks / examples
      - pandas>=2.0        # benchmarks
      - pytest>=7          # tests
