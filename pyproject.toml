[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "softdtw-cuda-torch"
version = "0.1.0"
description = "SoftDTW with CUDA kernels (Numba) and PyTorch autograd"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Ron Shapira Weber", email = "ronsha@post.bgu.ac.il"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numba>=0.60",
    "numba-cuda-mlir>=0.5",
    "numpy>=2.0",
]

[project.optional-dependencies]
cu12 = ["numba-cuda-mlir[cu12]"]
cu13 = ["numba-cuda-mlir[cu13]"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/nzxyin/sdtw-cuda-torch"
Repository = "https://github.com/nzxyin/sdtw-cuda-torch"

[tool.setuptools.packages.find]
where = ["."]
include = ["softdtw_cuda*"]
